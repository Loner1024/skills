interface:
  display_name: "Writing for Agents"
  short_description: "Write and prune the documents agents consume: skill descriptions, SKILL.md, AGENTS.md, and reference reached by pointer"
  triggers:
    - "write a skill"
    - "edit a skill"
    - "author a skill"
    - "SKILL.md"
    - "skill description"
    - "skill frontmatter"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "agent instructions"
    - "model-invoked or user-invoked"
    - "split a skill"
    - "prune a skill"
    - "写 skill"
    - "改 skill"
    - "写 SKILL.md"
    - "skill 描述怎么写"
    - "skill 的 frontmatter"
    - "写 AGENTS.md"
    - "给 agent 看的文档"
    - "精简 skill"
    - "拆 skill"
  not_triggers:
    - "human-facing prose"
    - "blog post or README for humans"
    - "code review"
    - "文案润色"
    - "写给人看的文档"
    - "代码评审"
