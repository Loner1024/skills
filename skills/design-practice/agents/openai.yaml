interface:
  display_name: "Design Practice"
  short_description: "Product design around the code, in six routes: critique, design-system audit, developer handoff, UX copy, research planning, research synthesis — carried from Anthropic's design plugin"
  triggers:
    - "design-practice"
    - "review this design"
    - "critique this mockup"
    - "what do you think of this screen"
    - "design system audit"
    - "document this component"
    - "handoff spec"
    - "spec this for engineering"
    - "write copy for this button"
    - "review this error message"
    - "synthesize these interviews"
    - "plan a user research study"
    - "设计评审"
    - "设计走查"
    - "看看这个设计"
    - "设计系统审计"
    - "组件文档"
    - "交接标注"
    - "UI 文案"
    - "错误提示怎么写"
    - "访谈整理"
    - "用户研究计划"
  not_triggers:
    - "visual polish in running code"
    - "animation or motion"
    - "frontend implementation"
    - "performance or layout jank"
    - "technical diagrams"
    - "architecture decisions"
    - "界面打磨"
    - "动效"
    - "前端实现"
    - "画图"
    - "架构设计"
