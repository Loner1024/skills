interface:
  display_name: "Sharpen"
  short_description: "Make a task deeper, not bigger, then rewrite the prompt"
  triggers:
    - "sharpen"
    - "sharpen this prompt"
    - "sharpen this task"
    - "make this task deeper"
    - "deepen this request"
  not_triggers:
    - "execute the task"
    - "rewrite the result"
    - "review this diff"
