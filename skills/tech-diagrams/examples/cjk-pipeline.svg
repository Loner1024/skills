<svg role="img" aria-labelledby="cjk-title cjk-desc" viewBox="0 0 1100 320" width="1100" height="320"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Inter, PingFang SC, Hiragino Sans, Heiti SC, Noto Sans CJK SC, sans-serif">
  <title id="cjk-title">请求生命周期：客户端到源站</title>
  <desc id="cjk-desc">客户端请求先进边缘缓存，未命中时回源站获取分片元数据，随后在原进程内二分查找目标路径。图中省略重试与冷启动路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4C4C4C"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0072F5"/>
    </marker>
  </defs>

  <rect width="1100" height="320" fill="#FAFAFA"/>

  <rect x="88" y="88" width="456" height="152" rx="6" fill="#EBEBEB" opacity=".55"/>
  <text x="104" y="110" fill="#4C4C4C" font-size="11" font-family="Menlo, SF Mono, monospace"
        letter-spacing="0.8">EDGE</text>

  <path d="M 304 164 H 448" fill="none" stroke="#4C4C4C" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 632 164 H 776" fill="none" stroke="#0072F5" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <g class="edge-label">
    <rect class="mask" x="328" y="144" width="96" height="16" rx="3" fill="#F2F2F2"/>
    <text x="376" y="160" fill="#4C4C4C" font-size="11" text-anchor="middle">缓存未命中</text>
  </g>

  <g class="node">
    <rect x="120" y="132" width="184" height="64" rx="6" fill="#F2F2F2" stroke="#C9C9C9"/>
    <text x="136" y="158" fill="#171717" font-size="13" font-weight="500">边缘缓存</text>
    <text x="136" y="178" fill="#4C4C4C" font-size="11" font-family="Menlo, SF Mono, monospace">cache-hit</text>
  </g>
  <g class="node is-focal">
    <rect x="448" y="132" width="184" height="64" rx="6" fill="#F0F7FF" stroke="#0072F5"/>
    <text x="464" y="158" fill="#171717" font-size="13" font-weight="500">分片查找</text>
    <text x="464" y="178" fill="#0062D1" font-size="11" font-family="Menlo, SF Mono, monospace">200 KB · O(log n)</text>
  </g>
  <g class="node">
    <rect x="776" y="132" width="184" height="64" rx="6" fill="#F2F2F2" stroke="#C9C9C9"/>
    <text x="792" y="158" fill="#171717" font-size="13" font-weight="500">源站</text>
    <text x="792" y="178" fill="#4C4C4C" font-size="11" font-family="Menlo, SF Mono, monospace">cold miss</text>
  </g>
</svg>
