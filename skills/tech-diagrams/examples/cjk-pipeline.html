<!doctype html>
<html lang="zh-CN" data-register="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请求生命周期：客户端到源站 — 图表预览（浅色 register + 中文标签）</title>
<style>
  [data-register="light"] {
    --td-canvas:#FAFAFA; --td-surface:#F2F2F2; --td-surface-2:#EBEBEB;
    --td-hairline:#C9C9C9; --td-hairline-strong:#A8A8A8;
    --td-text:#171717; --td-text-2:#4C4C4C; --td-text-3:#4C4C4C;
    --td-accent:#0072F5; --td-accent-soft:#F0F7FF; --td-accent-text:#0062D1;
    --td-ok:#297A3A; --td-warn:#A35200; --td-err:#CB2A2F; --td-radius:6px;
  }
  :root {
    --td-font-sans: Inter, "PingFang SC", "Hiragino Sans", "Heiti SC", "Noto Sans CJK SC", sans-serif;
    --td-font-mono: Menlo, "SF Mono", SFMono-Regular, Consolas, monospace;
  }
  body { margin:0; padding:40px 24px; background:var(--td-canvas); color:var(--td-text); font-family:var(--td-font-sans); }
  .td-figure { max-width:1120px; margin:0 auto; --td-figure-inset:9.5%; }
  .td-title { margin:0 0 4px; font-size:20px; font-weight:600; letter-spacing:0; }
  .td-deck { margin:0 0 24px; font-size:13px; color:var(--td-text-2); max-width:60ch; }
  .td-svg { display:block; width:100%; height:auto; border-radius:var(--td-radius); }
  .td-caption { margin:16px 0 0; font-size:12px; line-height:1.6; color:var(--td-text-2); max-width:68ch; }
  /* 同上：页面文字与图内可见内容左对齐（8% of 1100 = 88px 内边距），而不是与不可见的画布对齐。 */
  .td-title, .td-deck, .td-caption { margin-left: var(--td-figure-inset); }
  /* 不再覆盖打印背景：浅色画布本身就是纸色，强制白色底反而会在这套配色里留下唯一的纯白。 */
</style>
</head>
<body>
<!-- EXAMPLE (light register + CJK). Exercises the CJK font stack end to end: the root font-family
     must list a CJK family or rsvg/Chrome will substitute (and may produce tofu boxes). -->
<figure class="td-figure">
  <h1 class="td-title">请求生命周期：客户端到源站</h1>
  <p class="td-deck">一次请求先查边缘缓存，未命中时取回一个 200 KB 分片，再在进程内二分查找目标路径。</p>

  <svg class="td-svg" role="img" aria-labelledby="cjk-title cjk-desc" viewBox="0 0 1100 320"
       width="1100" height="320" xmlns="http://www.w3.org/2000/svg"
       font-family="Inter, PingFang SC, Hiragino Sans, Heiti SC, Noto Sans CJK SC, sans-serif">
    <title id="cjk-title">请求生命周期：客户端到源站</title>
    <desc id="cjk-desc">客户端请求先进边缘缓存，未命中时回源站获取分片元数据，随后在原进程内二分查找目标路径。图中省略重试与冷启动路径。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4C4C4C"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0072F5"/>
      </marker>
    </defs>

    <rect width="1100" height="320" fill="#FAFAFA"/>

    <rect x="88" y="88" width="456" height="152" rx="6" fill="#EBEBEB" opacity=".55"/>
    <text x="104" y="110" fill="#4C4C4C" font-size="11" font-family="Menlo, SF Mono, monospace"
          letter-spacing="0.8">EDGE</text>

    <path d="M 304 164 H 448" fill="none" stroke="#4C4C4C" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 632 164 H 776" fill="none" stroke="#0072F5" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <g class="edge-label">
      <rect class="mask" x="328" y="144" width="96" height="16" rx="3" fill="#F2F2F2"/>
      <text x="376" y="160" fill="#4C4C4C" font-size="11" text-anchor="middle">缓存未命中</text>
    </g>

    <g class="node">
      <rect x="120" y="132" width="184" height="64" rx="6" fill="#F2F2F2" stroke="#C9C9C9"/>
      <text x="136" y="158" fill="#171717" font-size="13" font-weight="500">边缘缓存</text>
      <text x="136" y="178" fill="#4C4C4C" font-size="11" font-family="Menlo, SF Mono, monospace">cache-hit</text>
    </g>
    <g class="node is-focal">
      <rect x="448" y="132" width="184" height="64" rx="6" fill="#F0F7FF" stroke="#0072F5"/>
      <text x="464" y="158" fill="#171717" font-size="13" font-weight="500">分片查找</text>
      <text x="464" y="178" fill="#0062D1" font-size="11" font-family="Menlo, SF Mono, monospace">200 KB · O(log n)</text>
    </g>
    <g class="node">
      <rect x="776" y="132" width="184" height="64" rx="6" fill="#F2F2F2" stroke="#C9C9C9"/>
      <text x="792" y="158" fill="#171717" font-size="13" font-weight="500">源站</text>
      <text x="792" y="178" fill="#4C4C4C" font-size="11" font-family="Menlo, SF Mono, monospace">cold miss</text>
    </g>
  </svg>

  <figcaption class="td-caption">
    请求先命中边缘缓存；未命中时取回一个约 200 KB 的分片，二分的索引查找使只有命中的那条记录被解析。
    图中省略了重试与冷启动路径。
  </figcaption>
</figure>
</body>
</html>
