interface:
  display_name: "Tech Diagrams"
  short_description: "Draw publication-quality technical figures as hand-authored SVG plus a self-contained HTML preview, lint them before delivery, and say when a table or prose is the better answer"
  triggers:
    - "tech-diagrams"
    - "draw a diagram"
    - "architecture diagram"
    - "data flow diagram"
    - "sequence diagram"
    - "state machine diagram"
    - "swimlane"
    - "benchmark chart"
    - "figure for the README"
    - "画图"
    - "架构图"
    - "数据流图"
    - "流程图"
    - "时序图"
    - "状态机图"
    - "对比图"
  not_triggers:
    - "photo or illustration"
    - "slide deck"
    - "document layout"
    - "照片生成"
    - "整份幻灯片"
