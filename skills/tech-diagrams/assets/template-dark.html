<!doctype html>
<html lang="en" data-register="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharded metadata lookup — figure preview</title>
<style>
  /* Inline of assets/tokens.css. Keep this block in the preview; the standalone .svg must
     carry resolved values instead. */
  :root, [data-register="dark"] {
    --td-canvas:#0A0A0B; --td-surface:#111214; --td-surface-2:#16181C;
    --td-hairline:rgba(255,255,255,.08); --td-hairline-strong:rgba(255,255,255,.16);
    --td-text:#EDEDF0; --td-text-2:#9BA1A6; --td-text-3:#7C8389;
    --td-accent:#5E6AD2; --td-accent-soft:#171A2B; --td-accent-text:#A7AEF8;
    --td-ok:#3FB950; --td-warn:#D29922; --td-err:#F85149; --td-radius:8px;
  }
  :root {
    --td-font-sans: Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --td-font-mono: Menlo, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
    --td-font-cjk: "PingFang SC", "Hiragino Sans", "Heiti SC", "Noto Sans CJK SC", sans-serif;
  }
  body { margin:0; padding:40px 24px; background:var(--td-canvas); color:var(--td-text); font-family:var(--td-font-sans); }
  .td-figure { max-width:1120px; margin:0 auto; --td-figure-inset:9.5%; }
  .td-title { margin:0 0 4px; font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .td-deck { margin:0 0 24px; font-size:13px; color:var(--td-text-2); max-width:68ch; }
  .td-svg { display:block; width:100%; height:auto; border-radius:var(--td-radius); }
  .td-caption { margin:16px 0 0; font-size:12px; line-height:1.5; color:var(--td-text-2); max-width:68ch; }
  /* The figure's visible content sits inside its canvas, so the page text shares that inset
     instead of aligning to the invisible canvas box. Measure it, never copy it from another
     figure: `scripts/render.sh <figure>.svg --inset` prints the number (9.5% = 105px of 1100
     for this figure). Set 0 when a figure's content runs edge to edge. */
  .td-title, .td-deck, .td-caption { margin-left: var(--td-figure-inset); }
  @media (prefers-reduced-motion: reduce) { .td-svg * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<!--
  TEMPLATE (dark). Replace:
    - the <title> and the .td-title / .td-deck / .td-caption text
    - the SVG body between the a11y block and </svg>
  Keep: the token block, the a11y block, the grid (4px), the connector-before-node order.
  After editing, run: python3 scripts/self_check.py <this file> && ./scripts/render.sh <this file>
-->
<figure class="td-figure">
  <h1 class="td-title">Indexed shards remove the dependent metadata round trip</h1>
  <p class="td-deck">Before: HEAD then GET per path. After: one bounded shard fetch, then an in-process binary search.</p>

  <svg class="td-svg" role="img" aria-labelledby="lookup-title lookup-desc"
       viewBox="0 0 1100 320" width="1100" height="320" xmlns="http://www.w3.org/2000/svg"
       font-family="Inter, PingFang SC, Hiragino Sans, Heiti SC, Noto Sans CJK SC, sans-serif">
    <title id="lookup-title">Sharded metadata lookup</title>
    <desc id="lookup-desc">A request checks the edge cache, misses, and fetches one bounded 200 KB shard whose index is binary-searched for the path.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#9BA1A6"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#5E6AD2"/>
      </marker>
    </defs>

    <rect width="1100" height="320" fill="#0A0A0B"/>

    <rect class="td-zone" x="88" y="88" width="456" height="152" rx="8" fill="#16181C" opacity=".55"/>
    <text class="td-zone-label" x="104" y="110" fill="#7C8389" font-size="11"
          font-family="Menlo, SF Mono, monospace" letter-spacing="0.8">EDGE</text>

    <!-- connectors before nodes -->
    <path d="M 304 164 H 448" fill="none" stroke="#9BA1A6" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 632 164 H 776" fill="none" stroke="#5E6AD2" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <g class="td-edge-label">
      <rect class="mask" x="328" y="144" width="96" height="16" rx="3" fill="#111214"/>
      <text x="376" y="160" fill="#9BA1A6" font-size="11" text-anchor="middle">cache miss</text>
    </g>

    <g class="td-node">
      <rect x="120" y="132" width="184" height="64" rx="8" fill="#111214" stroke="rgba(255,255,255,.08)"/>
      <text x="136" y="158" fill="#EDEDF0" font-size="13" font-weight="500">Edge cache</text>
      <text x="136" y="178" fill="#9BA1A6" font-size="11" font-family="Menlo, SF Mono, monospace">cache-hit</text>
    </g>
    <g class="td-node is-focal">
      <rect x="448" y="132" width="184" height="64" rx="8" fill="#171A2B" stroke="#5E6AD2"/>
      <text x="464" y="158" fill="#EDEDF0" font-size="13" font-weight="500">Shard lookup</text>
      <text x="464" y="178" fill="#A7AEF8" font-size="11" font-family="Menlo, SF Mono, monospace">200 KB · O(log n)</text>
    </g>
    <g class="td-node">
      <rect x="776" y="132" width="184" height="64" rx="8" fill="#111214" stroke="rgba(255,255,255,.08)"/>
      <text x="792" y="158" fill="#EDEDF0" font-size="13" font-weight="500">Origin</text>
      <text x="792" y="178" fill="#9BA1A6" font-size="11" font-family="Menlo, SF Mono, monospace">on cold miss</text>
    </g>
  </svg>

  <figcaption class="td-caption">
    A request checks the edge cache, misses, and fetches one bounded 200 KB shard whose index is
    binary-searched in O(log n), so only the matching record is parsed. This omits the cold-start
    path and retry behaviour.
  </figcaption>
</figure>
</body>
</html>
